<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zəfərə Gedən Yol - 3D</title>

    <!-- TAB ÜÇÜN LOQO (Favicon) -->
    <link rel="icon" type="image/png" href="PageLogo.png">
    <link rel="stylesheet" href="style.css">

    <!-- Three.js ve GLTFLoader (3D .glb modellerini yüklemek için) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <!-- SƏHİFƏNİN YUXARISI ÜÇÜN BAŞLIQ VƏ LOQO HİSSƏSİ -->
    <header class="header-container">
        <img src="PageLogo.png" alt="Zəfər Loqosu" class="site-logo">
        <h2>Azərbaycan və onun Zəfərə gedən yolu!</h2>
    </header>

    <div class="tl">
        <!-- SVG ƏVƏZİNƏ 3D OBYEKT SAHƏSİ -->
        <section class="tl-map">
            <h3>44 günlük Vətən müharibəsi: günbəgün (3D)</h3>
            
            <!-- 3D Səhnənin yerləşəcəyi konteyner -->
            <div id="three-container" style="width: 100%; height: 420px; position: relative; background: #0b0f19; border-radius: 12px; overflow: hidden;"></div>

            <div class="legend" style="margin:8px auto 0;gap:14px;font-size:12px">
                <div class="legend-item"><span class="box" style="background:#ef4444"></span>İşğal altında</div>
                <div class="legend-item"><span class="box" style="background:#f59e0b"></span>Yarım işğal</div>
                <div class="legend-item"><span class="box" style="background:#10b981"></span>Azad edilib</div>
                <div class="legend-item"><span class="box" style="background:#38bdf8"></span>Bəyanatla təhvil</div>
            </div>
        </section>

        <section class="tl-side">
            <h3 class="tl-day" id="tl-day">1-ci Gün</h3>
            <div class="tl-text" id="tl-text" aria-live="polite">
                Müzəffər Azərbaycan Ordusu əks-hücum əməliyyatlarına başladı.
            </div>

            <div class="tl-stats">
                <div><b id="tl-n">0</b> azad edilən məntəqə (cəmi)</div>
                <div><b id="tl-r">0</b> rayonlar: tam / qismən / təhvil</div>
            </div>

            <div class="tl-ctl">
                <button id="tl-prev" aria-label="Əvvəlki gün">◀</button>
                <button id="tl-play">Başlat</button>
                <button id="tl-next" aria-label="Növbəti gün">▶▶</button>
                <select id="tl-speed" aria-label="Sürət">
                    <option value="1600">0.5x</option>
                    <option value="800" selected>1x</option>
                    <option value="400">2x</option>
                    <option value="200">4x</option>
                </select>
            </div>
            <div class="tl-ctl">
                <input type="range" id="tl-range" min="0" max="47" value="0" aria-label="Gün">
            </div>
            <div class="tl-log" id="tl-log"></div>
        </section>
    </div>

    <script>
        // --- THREE.JS KURULUMU ---
        const container = document.getElementById('three-container');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });

        renderer.setSize(container.clientWidth, container.clientHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        container.appendChild(renderer.domElement);

        // Fare ile açı değiştirebilmek için OrbitControls (Otomatik dönme kapalı)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.autoRotate = false; // DÖNMESİNİ ENGELLEDİK

        // Işıklandırma
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
        dirLight.position.set(10, 20, 15);
        scene.add(dirLight);

        camera.position.set(0, 10, 15);
        camera.lookAt(0, 0, 0);

        // --- .GLB MODELLERİNİ YÜKLEME ---
        const loader = new THREE.GLTFLoader();

        let azerbaijanModel = null;
        let armeniaModel = null;

        // 1. Azerbaycan GLB Modeli Yükle
		loader.load('Azerbaijan.glb', (gltf) => {
			azerbaijanModel = gltf.scene;
			azerbaijanModel.scale.set(1, 1, 1); // Lazım gələrsə ölçünü böyüdüb/kiçiltmək olar (məs: 0.5 və ya 2)
			scene.add(azerbaijanModel);
		}, undefined, (error) => {
			console.error('Azerbaijan.glb xətası:', error);
		});

		loader.load('armenia.glb', (gltf) => {
			armeniaModel = gltf.scene;
			armeniaModel.scale.set(1, 1, 1);
			scene.add(armeniaModel);
		}, undefined, (error) => {
			console.error('Armenia.glb xətası:', error);
		});

        // --- RENDER DÖNGÜSÜ (Dönüş animasyonu yok) ---
        function animate() {
            requestAnimationFrame(animate);
            controls.update(); // Sadece kullanıcı fare ile hareket ettirirse günceller
            renderer.render(scene, camera);
        }
        animate();

        // Ekran boyutu değiştiğinde 3D alanı günceller
        window.addEventListener('resize', () => {
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        });
    </script>
</body>
</html>
